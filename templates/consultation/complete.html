{% extends 'base.html' %}
{% load static %}

{% block title %}상담신청 완료 - {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 text-center" data-aos="fade-up">
                <div class="mb-4">
                    <div class="rounded-circle bg-success text-white d-inline-flex align-items-center justify-content-center"
                         style="width: 100px; height: 100px; font-size: 3rem;">
                        <i class="bi bi-check-lg"></i>
                    </div>
                </div>

                <h2 class="mb-3">상담 신청이 완료되었습니다</h2>
                <p class="text-muted mb-4">
                    상담 신청이 정상적으로 접수되었습니다.<br>
                    빠른 시일 내에 전문 상담원이 연락드리겠습니다.
                </p>

                <div class="card bg-light border-0 mb-4">
                    <div class="card-body p-4">
                        <h5 class="mb-3">상담 진행 안내</h5>
                        <div class="d-flex justify-content-center gap-4 flex-wrap">
                            <div class="text-center">
                                <div class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center mb-2"
                                     style="width: 40px; height: 40px;">1</div>
                                <p class="small mb-0">신청 접수</p>
                            </div>
                            <div class="text-muted align-self-center">→</div>
                            <div class="text-center">
                                <div class="rounded-circle bg-white border d-inline-flex align-items-center justify-content-center mb-2"
                                     style="width: 40px; height: 40px;">2</div>
                                <p class="small mb-0">상담원 배정</p>
                            </div>
                            <div class="text-muted align-self-center">→</div>
                            <div class="text-center">
                                <div class="rounded-circle bg-white border d-inline-flex align-items-center justify-content-center mb-2"
                                     style="width: 40px; height: 40px;">3</div>
                                <p class="small mb-0">전화 상담</p>
                            </div>
                            <div class="text-muted align-self-center">→</div>
                            <div class="text-center">
                                <div class="rounded-circle bg-white border d-inline-flex align-items-center justify-content-center mb-2"
                                     style="width: 40px; height: 40px;">4</div>
                                <p class="small mb-0">맞춤 컨설팅</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-3 justify-content-center">
                    <a href="{% url 'core:home' %}" class="btn btn-outline-primary">
                        홈으로 가기
                    </a>
                    <a href="{% url 'properties:list' %}" class="btn btn-primary">
                        추천 물건 보기
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
