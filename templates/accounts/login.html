{% extends 'base.html' %}
{% load static %}

{% block title %}로그인 - {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg" data-aos="fade-up">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="mb-2">로그인</h2>
                            <p class="text-muted">계정에 로그인하세요</p>
                        </div>

                        <form method="post" class="needs-validation" novalidate>
                            {% csrf_token %}

                            <div class="mb-3">
                                <label for="id_username" class="form-label">아이디</label>
                                {{ form.username }}
                            </div>

                            <div class="mb-4">
                                <label for="id_password" class="form-label">비밀번호</label>
                                {{ form.password }}
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="remember">
                                    <label class="form-check-label" for="remember">로그인 유지</label>
                                </div>
                                <a href="#" class="text-primary small">비밀번호 찾기</a>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
                                로그인
                            </button>
                        </form>

                        <div class="text-center">
                            <span class="text-muted">계정이 없으신가요?</span>
                            <a href="{% url 'accounts:signup' %}" class="text-primary fw-bold">회원가입</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
